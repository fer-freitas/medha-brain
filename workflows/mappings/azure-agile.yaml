# De-para padrão Nexo ↔ Azure Boards (processo Agile). Squads sobrescrevem em nexo-brain/workflows/mappings/.
tracker: azure
types: {epic: Epic, feature: Feature, story: User Story, task: Task, bug: Bug}
states:
  Ideia:            {state: New}
  Refinamento:      {state: New, tags: [nexo-refinement]}
  Pronto:           {state: New, tags: [nexo-ready]}
  EmDev:            {state: Active}
  EmQA:             {state: Active, tags: [nexo-qa]}
  EmReview:         {state: Resolved}
  AguardandoHumano: {state: Resolved, tags: [nexo-human-gate]}
  Concluido:        {state: Closed}
  Bloqueado:        {keep_state: true, tags: [nexo-blocked]}
  Escalado:         {keep_state: true, tags: [nexo-escalated]}
  Cancelado:        {state: Removed}
fields:
  story_points: Microsoft.VSTS.Scheduling.StoryPoints
  acceptance: Microsoft.VSTS.Common.AcceptanceCriteria
reverse: {New: Pronto, Active: EmDev, Resolved: EmReview, Closed: Concluido, Removed: Cancelado}
