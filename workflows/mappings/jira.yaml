# De-para padrão Medha ↔ Jira (workflow simplificado). Estados = nomes de status; transições resolvidas por nome.
tracker: jira
types: {epic: Epic, feature: Epic, story: Story, task: Task, bug: Bug}
states:
  Ideia:            {state: To Do}
  Refinamento:      {state: To Do, tags: [medha-refinement]}
  Pronto:           {state: To Do, tags: [medha-ready]}
  EmDev:            {state: In Progress}
  EmQA:             {state: In Progress, tags: [medha-qa]}
  EmReview:         {state: In Review}
  AguardandoHumano: {state: In Review, tags: [medha-human-gate]}
  Concluido:        {state: Done}
  Bloqueado:        {keep_state: true, tags: [medha-blocked]}
  Escalado:         {keep_state: true, tags: [medha-escalated]}
  Cancelado:        {state: Done, tags: [medha-cancelled]}
reverse: {To Do: Pronto, In Progress: EmDev, In Review: EmReview, Done: Concluido}
