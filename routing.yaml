# Catálogo de rotas e regras de roteamento (padrão embutido; medha-brain/routing/*.yaml sobrescreve).
# tier: cheap | mid | top · cost: custo relativo por atividade · tool_vendor/model_vendor: por onde os dados passam.
routes:
  - { id: claude/haiku,              tool: claude,  model: haiku,             tool_vendor: anthropic, model_vendor: anthropic, tier: cheap, cost: 1 }
  - { id: claude/sonnet,             tool: claude,  model: sonnet,            tool_vendor: anthropic, model_vendor: anthropic, tier: mid,   cost: 4 }
  - { id: claude/opus,               tool: claude,  model: opus,              tool_vendor: anthropic, model_vendor: anthropic, tier: top,   cost: 12 }
  # Copilot escolhe o modelo liberado no plano da conta (nomes fixos dependem do plano; achado no teste real).
  # Fora das revisões: com `auto` o fornecedor do modelo é desconhecido e a revisão independente não é garantida.
  - { id: copilot/auto,              tool: copilot, model: auto,              tool_vendor: github,    model_vendor: github,    tier: mid,   cost: 4, model_fixed: false }
  - { id: copilot/gpt-5-mini,        tool: copilot, model: gpt-5-mini,        tool_vendor: github,    model_vendor: openai,    tier: cheap, cost: 1 }
  - { id: copilot/claude-sonnet-4.5, tool: copilot, model: claude-sonnet-4.5, tool_vendor: github,    model_vendor: anthropic, tier: mid,   cost: 4 }
  - { id: copilot/gpt-5,             tool: copilot, model: gpt-5,             tool_vendor: github,    model_vendor: openai,    tier: top,   cost: 10 }
  - { id: devin/default,             tool: devin,   model: default,           tool_vendor: cognition, model_vendor: cognition, tier: top,   cost: 10 }
  # F43: mais agentes de código; entram só quando a CLI está instalada e autenticada
  - { id: gemini/flash,              tool: gemini,       model: gemini-2.5-flash,  tool_vendor: google,    model_vendor: google,    tier: cheap, cost: 1 }
  - { id: gemini/pro,                tool: gemini,       model: gemini-2.5-pro,    tool_vendor: google,    model_vendor: google,    tier: mid,   cost: 4 }
  - { id: codex/gpt-5-codex,         tool: codex,        model: gpt-5-codex,       tool_vendor: openai,    model_vendor: openai,    tier: top,   cost: 10 }
  - { id: cursor/sonnet-4.5,         tool: cursor,       model: sonnet-4.5,        tool_vendor: cursor,    model_vendor: anthropic, tier: mid,   cost: 4 }
  - { id: aider/sonnet,              tool: aider,        model: sonnet,            tool_vendor: anthropic,   model_vendor: anthropic, tier: mid,   cost: 4 }
  # F37: conexão direta com as LLMs (agents.api.mode); entram só quando o provedor está ligado e com chave
  - { id: anthropic/haiku,           tool: anthropic,    model: claude-haiku-4-5-20251001, tool_vendor: anthropic, model_vendor: anthropic, tier: cheap, cost: 1 }
  - { id: anthropic/sonnet,          tool: anthropic,    model: claude-sonnet-5,   tool_vendor: anthropic, model_vendor: anthropic, tier: mid,   cost: 4 }
  - { id: anthropic/opus,            tool: anthropic,    model: claude-opus-5-5,   tool_vendor: anthropic, model_vendor: anthropic, tier: top,   cost: 12 }
  - { id: openai/gpt-5-mini,         tool: openai,       model: gpt-5-mini,        tool_vendor: openai,    model_vendor: openai,    tier: cheap, cost: 1 }
  - { id: openai/gpt-5,              tool: openai,       model: gpt-5,             tool_vendor: openai,    model_vendor: openai,    tier: top,   cost: 10 }
  - { id: azure-openai/gpt-5,        tool: azure-openai, model: gpt-5,             tool_vendor: microsoft, model_vendor: openai,    tier: top,   cost: 10 }
  - { id: gateway/default,           tool: gateway,      model: default,           tool_vendor: gateway,   model_vendor: gateway,   tier: mid,   cost: 4 }
  # F44: Amazon Bedrock (modelo pelo apelido; o id no Bedrock vem de agents.api.providers.bedrock.models) e Gemini nativo
  - { id: bedrock/haiku,             tool: bedrock,      model: claude-haiku,      tool_vendor: aws,       model_vendor: anthropic, tier: cheap, cost: 1 }
  - { id: bedrock/sonnet,            tool: bedrock,      model: claude-sonnet,     tool_vendor: aws,       model_vendor: anthropic, tier: mid,   cost: 4 }
  - { id: bedrock/opus,              tool: bedrock,      model: claude-opus,       tool_vendor: aws,       model_vendor: anthropic, tier: top,   cost: 12 }
  - { id: gemini-api/flash,          tool: gemini-api,   model: gemini-2.5-flash,  tool_vendor: google,    model_vendor: google,    tier: cheap, cost: 1 }
  - { id: gemini-api/pro,            tool: gemini-api,   model: gemini-2.5-pro,    tool_vendor: google,    model_vendor: google,    tier: mid,   cost: 4 }

# Probabilidade de sucesso a priori por papel × tier (substituída pelo histórico a partir da F7).
priors:
  default:    { cheap: 0.55, mid: 0.75, top: 0.85 }
  classifier: { cheap: 0.90, mid: 0.93, top: 0.95 }
  developer:  { cheap: 0.45, mid: 0.75, top: 0.85 }
  planner:    { cheap: 0.35, mid: 0.70, top: 0.88 }
  breakdown:  { cheap: 0.35, mid: 0.70, top: 0.88 }
  discovery:  { cheap: 0.35, mid: 0.70, top: 0.88 }
  explainer:  { cheap: 0.50, mid: 0.80, top: 0.88 }
  writer:     { cheap: 0.55, mid: 0.80, top: 0.88 }
  reviewer:   { cheap: 0.40, mid: 0.70, top: 0.88 }
  security-reviewer: { cheap: 0.40, mid: 0.70, top: 0.88 }
  qa-author:  { cheap: 0.45, mid: 0.75, top: 0.85 }
  characterization: { cheap: 0.45, mid: 0.75, top: 0.85 }
  failure-triager: { cheap: 0.85, mid: 0.90, top: 0.93 }
  curator:    { cheap: 0.80, mid: 0.85, top: 0.90 }
  assistant:  { cheap: 0.88, mid: 0.92, top: 0.94 }  # F50: painel — entender o pedido e indicar o comando
  analyst:    { cheap: 0.45, mid: 0.78, top: 0.88 }  # F54: tech lead analisa o requisito funcional
  architect:  { cheap: 0.35, mid: 0.70, top: 0.88 }  # F54: requisito técnico com premissas
  briefing:   { cheap: 0.55, mid: 0.82, top: 0.88 }  # F54: explica a tarefa ao dev
  breakdown-reviewer: { cheap: 0.55, mid: 0.82, top: 0.88 }  # 0.53.7: cada tarefa dá para implementar sem perguntar?

# Custo de uma falha (retrabalho, ciclo de bug, tempo humano) na mesma unidade de `cost`.
failure_penalty:
  default: 15
  classifier: 1
  assistant: 1
  curator: 2
  failure-triager: 1

# Probabilidade mínima aceitável no perfil economico e teto de custo no maxima-qualidade.
profiles:
  economico:        { min_success: 0.70 }
  balanceado:       {}
  maxima-qualidade: { max_cost: 12 }

# Preferência padrão por papel (ordem = desempate).
defaults:
  classifier: [claude/haiku, copilot/auto, copilot/gpt-5-mini, anthropic/haiku, openai/gpt-5-mini, bedrock/haiku, gemini-api/flash, gateway/default]
  developer:  [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, devin/default, claude/opus, gemini/pro, codex/gpt-5-codex, cursor/sonnet-4.5, aider/sonnet, anthropic/sonnet, openai/gpt-5, anthropic/opus, azure-openai/gpt-5, bedrock/sonnet, bedrock/opus, gemini-api/pro, gateway/default]
  planner:    [claude/opus, copilot/auto, copilot/gpt-5, anthropic/opus, openai/gpt-5, azure-openai/gpt-5, bedrock/opus, gemini-api/pro, gateway/default]
  breakdown:  [claude/opus, copilot/auto, copilot/gpt-5, claude/sonnet, anthropic/opus, openai/gpt-5, anthropic/sonnet, azure-openai/gpt-5, bedrock/sonnet, bedrock/opus, gemini-api/pro, gateway/default]
  discovery:  [claude/opus, copilot/auto, copilot/gpt-5, anthropic/opus, openai/gpt-5, azure-openai/gpt-5, bedrock/opus, gemini-api/pro, gateway/default]
  explainer:  [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  writer:     [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, gemini/flash, cursor/sonnet-4.5, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  qa-author:  [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, gemini/pro, codex/gpt-5-codex, cursor/sonnet-4.5, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  characterization: [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, gemini/pro, codex/gpt-5-codex, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  security-reviewer: [copilot/gpt-5, claude/opus, openai/gpt-5, anthropic/opus, azure-openai/gpt-5, bedrock/opus, gemini-api/pro, gateway/default]
  failure-triager: [claude/haiku, copilot/auto, copilot/gpt-5-mini, anthropic/haiku, openai/gpt-5-mini, bedrock/haiku, gemini-api/flash, gateway/default]
  integrator: [claude/sonnet, copilot/auto, copilot/gpt-5, gemini/pro, codex/gpt-5-codex, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  assistant:  [claude/haiku, claude/sonnet, copilot/auto, copilot/gpt-5-mini, devin/default, anthropic/haiku, openai/gpt-5-mini, bedrock/haiku, gemini-api/flash, gateway/default]
  curator:    [claude/haiku, copilot/auto, copilot/gpt-5-mini, anthropic/haiku, openai/gpt-5-mini, bedrock/haiku, gemini-api/flash, gateway/default]
  reviewer:   [copilot/gpt-5, claude/opus, openai/gpt-5, anthropic/opus, azure-openai/gpt-5, bedrock/opus, gemini-api/pro, gateway/default]
  analyst:    [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, claude/opus, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  architect:  [claude/opus, copilot/auto, copilot/gpt-5, claude/sonnet, anthropic/opus, openai/gpt-5, azure-openai/gpt-5, bedrock/opus, gemini-api/pro, gateway/default]
  breakdown-reviewer: [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]
  briefing:   [claude/sonnet, copilot/auto, copilot/claude-sonnet-4.5, copilot/gpt-5, anthropic/sonnet, openai/gpt-5, azure-openai/gpt-5, bedrock/sonnet, gemini-api/pro, gateway/default]

rules:
  - when: { role: developer, kind: migration }
    prefer: [claude/opus, copilot/gpt-5]
    human_gate: true
  - when: { role: developer, stack: dotnet, size: L }
    prefer: [devin/default, claude/sonnet]
  - when: { role: developer, size: S }
    prefer: [claude/sonnet, copilot/claude-sonnet-4.5, claude/haiku]
