stack: python
semgrep_config: p/python
stages:
  - id: lint
    kind: lint
    tool: uv
    run: ["uv", "run", "--frozen", "ruff", "check", "--exit-zero", "--output-format", "sarif",
          "--output-file", "{out}/ruff.sarif", "."]
    parser: sarif
    report: "{out}/ruff.sarif"
    default_severity: medium
    fail_on: any  # qualquer achado de lint reprova; com baseline (F13), só os novos
    fix: ["uv", "run", "--frozen", "ruff", "check", "--fix", "--exit-zero", "--quiet"]  # correção determinística
    changed_only: [".py"]  # código existente (F13): só os arquivos alterados
    required: true
  - id: unit
    kind: unit
    tool: uv
    run: ["uv", "run", "--frozen", "pytest", "-q", "-p", "no:cacheprovider", "--junitxml={out}/junit.xml",
          "--cov=src", "--cov-report=xml:{out}/coverage.xml"]
    parser: junit
    report: "{out}/junit.xml"
    coverage: "{out}/coverage.xml"
    required: true
  - id: architecture
    kind: architecture
    tool: uv
    when_contains: {file: pyproject.toml, text: "tool.importlinter"}
    run: ["uv", "run", "--frozen", "lint-imports"]
    parser: exitcode
    required: true
  - id: sca
    kind: security
    tool: uvx
    pre: [["uv", "export", "--frozen", "--no-hashes", "--no-emit-project", "--quiet", "-o", "{out}/requirements.txt"]]
    run: ["uvx", "pip-audit", "--strict", "--progress-spinner", "off", "-r", "{out}/requirements.txt"]
    parser: exitcode
    default_severity: high
    required: true
  - id: load
    kind: load
    tool: k6
    when_exists: tests/load/script.js
    run: ["k6", "run", "--quiet", "tests/load/script.js"]
    parser: exitcode
    required: false
