# Python com pip (F51: o pip substitui o uv). {venv_python} = Python do ambiente virtual do projeto (.venv, ou
# venv/env se já existir); {pip_install} = o que o projeto declara (requirements-dev.txt › requirements.txt ›
# pyproject com extra/grupo dev); {pip_project} = o próprio projeto, editável, quando há requirements e pyproject.
stack: python
semgrep_config: p/python
stages:
  - id: venv
    kind: build
    setup: true  # prepara o ambiente: roda sempre (também com o pipeline filtrado) e no worktree do agente
    tool: "{python}"
    unless_exists: "{venv}"
    run: ["{python}", "-m", "venv", "{venv}"]
    parser: exitcode
    required: true
  - id: install
    kind: build
    setup: true  # prepara o ambiente: roda sempre (também com o pipeline filtrado) e no worktree do agente
    tool: "{venv_python}"
    when_param: pip_install
    run: ["{venv_python}", "-m", "pip", "install", "--quiet", "--disable-pip-version-check", "{pip_install}"]
    parser: exitcode
    required: true
    timeout: 1800
  - id: install-project
    kind: build
    setup: true  # prepara o ambiente: roda sempre (também com o pipeline filtrado) e no worktree do agente
    tool: "{venv_python}"
    when_param: pip_project
    run: ["{venv_python}", "-m", "pip", "install", "--quiet", "--disable-pip-version-check", "--no-deps",
          "{pip_project}"]
    parser: exitcode
    required: true
  - id: lint
    kind: lint
    tool: "{venv_python}"
    run: ["{venv_python}", "-m", "ruff", "check", "--exit-zero", "--output-format", "sarif",
          "--output-file", "{out}/ruff.sarif", "."]
    parser: sarif
    report: "{out}/ruff.sarif"
    default_severity: medium
    fail_on: any  # qualquer achado de lint reprova; com baseline (F13), só os novos
    fix: ["{venv_python}", "-m", "ruff", "check", "--fix", "--exit-zero", "--quiet"]  # correção determinística
    changed_only: [".py"]  # código existente (F13): só os arquivos alterados
    required: true
  - id: unit
    kind: unit
    tool: "{venv_python}"
    run: ["{venv_python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--junitxml={out}/junit.xml",
          "--cov=src", "--cov-report=xml:{out}/coverage.xml"]
    parser: junit
    report: "{out}/junit.xml"
    coverage: "{out}/coverage.xml"
    required: true
  - id: architecture
    kind: architecture
    tool: "{venv_python}"
    when_contains: {file: pyproject.toml, text: "tool.importlinter"}
    run: ["{venv_scripts}/lint-imports"]
    parser: exitcode
    required: true
  - id: sca
    kind: security
    network: public  # P-07: consulta PyPI e OSV (pip-audit)
    provision: pip-audit  # ambiente próprio em ~/.medha/tools (instalado com pip na primeira vez)
    tool: "{pip_audit}"  # audita o que está instalado no ambiente do projeto
    pre: [{run: ["{venv_python}", "-m", "pip", "freeze", "--exclude-editable", "--disable-pip-version-check"],
           stdout: "{out}/requirements-freeze.txt"}]
    run: ["{pip_audit}", "--strict", "--progress-spinner", "off", "--no-deps", "--disable-pip",
          "-r", "{out}/requirements-freeze.txt"]
    parser: exitcode
    default_severity: high
    required: true
  - id: load
    kind: load
    tool: k6
    when_exists: tests/load/script.js
    run: ["k6", "run", "--quiet", "tests/load/script.js"]
    parser: exitcode
    required: false
  - id: mutation
    kind: mutation
    tool: "{venv_python}"
    when_contains: {file: pyproject.toml, text: "tool.mutmut"}  # F15 (Q-01): força dos testes na área alterada
    pre: [["{venv_scripts}/mutmut", "run"]]
    run: ["{venv_scripts}/mutmut", "export-cicd-stats"]
    parser: mutation
    report: "mutants/mutmut-cicd-stats.json"
    min_score: "{min_mutation_score}"
    required: false
    timeout: 1800
