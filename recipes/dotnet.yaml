stack: dotnet
semgrep_config: p/csharp
stages:
  - id: build
    kind: build
    tool: dotnet
    run: ["dotnet", "build", "--nologo", "-warnaserror"]
    parser: exitcode
    required: true
  - id: lint
    kind: lint
    tool: dotnet
    run: ["dotnet", "format", "--verify-no-changes", "--no-restore"]
    parser: exitcode
    required: true
  - id: unit
    kind: unit
    tool: dotnet
    when_glob: "**/*Tests.csproj"
    run: ["dotnet", "test", "--nologo", "--no-build", "--logger", "trx;LogFileName=tests.trx",
          "--results-directory", "{out}", "--collect", "XPlat Code Coverage"]
    parser: trx
    report: "{out}/tests.trx"
    coverage_glob: "{out}/**/coverage.cobertura.xml"
    required: true
  - id: sca
    kind: security
    tool: dotnet
    run: ["dotnet", "list", "package", "--vulnerable", "--include-transitive"]
    parser: dotnet_vulnerable
    required: true
  - id: mutation
    kind: mutation
    tool: dotnet
    when_exists: stryker-config.json  # F15 (Q-01)
    run: ["dotnet", "stryker", "--reporter", "json", "--output", "{out}/stryker"]
    parser: mutation
    report: "{out}/stryker/reports/mutation-report.json"
    min_score: "{min_mutation_score}"
    required: false
    timeout: 1800
