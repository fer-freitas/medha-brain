# Política da org. O Nexo mescla com o PISO embutido: aqui só se RESTRINGE (acrescentar negações e
# caminhos proibidos, remover comandos permitidos). Afrouxar o piso é ignorado e vira violação (SEC-76).
# Política de execução dos agentes (SEC-13, SEC-20..24). nexo-brain/org/security/policy.yaml sobrescreve.
tool_kinds:
  Read: read
  Glob: read
  Grep: read
  LS: read
  NotebookRead: read
  Write: write
  Edit: write
  MultiEdit: write
  NotebookEdit: write
  Bash: shell
  PowerShell: shell
  shell: shell
  WebFetch: fetch
  WebSearch: fetch
  TodoWrite: harmless
  ExitPlanMode: harmless
  Task: deny
  Agent: deny

forbidden_paths:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.pfx"
  - "**/*.p12"
  - "**/*.key"
  - "**/id_rsa*"
  - "**/id_ed25519*"
  - "**/.ssh/**"
  - "**/.aws/**"
  - "**/.azure/**"
  - "**/secrets*.json"
  - "**/appsettings.Production.json"
  - "**/.git/config"
  - "**/.nexo/config.yaml"

# Prefixos de comando permitidos no perfil code-writer (após os bloqueios abaixo).
shell_allow:
  - "ls"
  - "pwd"
  - "cat"
  - "head"
  - "tail"
  - "wc"
  - "grep"
  - "rg"
  - "find"
  - "mkdir"
  - "rm"
  - "mv"
  - "cp"
  - "touch"
  - "echo"
  - "sed -n"
  - "diff"
  - "git status"
  - "git diff"
  - "git log"
  - "git show"
  - "dotnet build"
  - "dotnet test"
  - "dotnet format"
  - "dotnet run"
  - "dotnet restore"
  - "npm test"
  - "npm run"
  - "npm ci"
  - "npx vitest"
  - "npx eslint"
  - "npx tsc"
  - "npx prettier"
  - "npx playwright test"
  - "pytest"
  - "python -m pytest"
  - "uv run"
  - "uv sync"
  - "ruff"
  - "mypy"

# Bloqueios que prevalecem sobre a allowlist (regex).
shell_deny:
  - { pattern: "\\brm\\s+-[a-zA-Z]*[rf]", reason: "remoção recursiva/forçada" }
  - { pattern: "\\b(curl|wget|nc|ncat|telnet)\\b", reason: "acesso de rede não autorizado (SEC-23)" }
  - { pattern: "\\b(ssh|scp|sftp|rsync)\\b", reason: "acesso remoto" }
  - { pattern: "\\bgit\\s+(push|commit|reset|checkout|switch|rebase|merge|config|remote|tag)\\b", reason: "operação git reservada ao Nexo" }
  - { pattern: "\\bsudo\\b|\\bsu\\s", reason: "elevação de privilégio" }
  - { pattern: "\\b(npm|pnpm|yarn)\\s+(i|install|add)\\s+\\S", reason: "nova dependência exige check_dependency (SEC-25)" }
  - { pattern: "\\b(pip|pip3|uv\\s+pip|uv)\\s+(install|add)\\b", reason: "nova dependência exige check_dependency (SEC-25)" }
  - { pattern: "\\bdotnet\\s+add\\s+\\S+\\s+package\\b|\\bdotnet\\s+add\\s+package\\b", reason: "nova dependência exige check_dependency (SEC-25)" }
  - { pattern: "\\b(brew|apt|apt-get|yum|choco|winget)\\b", reason: "instalação de software no sistema" }
  - { pattern: "\\$\\(|`", reason: "substituição de comando" }
  - { pattern: "\\b(chmod|chown)\\s+-?R?\\s*[0-7]*7[0-7]*\\s+/", reason: "permissão em caminho do sistema" }
  - { pattern: "(^|\\s)(/etc|/usr|/bin|/System|C:\\\\Windows)", reason: "caminho do sistema" }
  - { pattern: "~/|\\$HOME|%USERPROFILE%", reason: "diretório do usuário" }

network:
  allowed_hosts: []

mcp:
  allowed_servers: [nexo]

# Ambiente dos agentes (S-01): só variáveis de sistema/proxy/certificados passam por padrão; nomes com cara de
# segredo (TOKEN, KEY, SECRET, PASSWORD...) só passam se listados aqui. `tools`: credencial da própria ferramenta.
agent_env:
  allow: []
  tools:
    claude: ["ANTHROPIC_*", "CLAUDE_*", "CLAUDE_CODE_*", "AWS_REGION", "CLOUD_ML_REGION"]
    copilot: ["COPILOT_*", "GH_TOKEN", "GITHUB_TOKEN", "GH_HOST"]
    devin: ["DEVIN_*"]
